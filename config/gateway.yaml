# Gateway configuration. Models, routes and team policies are data: change this file, not code.
version: "2026.10.1"

# Model catalogue. Prices are USD per 1M tokens and drive budgets, so a model without a price
# cannot be enabled. Anthropic prices are from Anthropic's public pricing (October 2026); fill
# in the others from your provider's price list before enabling them.
models:
  claude-opus:   {provider: anthropic, model: claude-opus-5-5,   input: "4.00", output: "20.00"}
  claude-sonnet: {provider: anthropic, model: claude-sonnet-5-5, input: "2.00", output: "10.00"}
  claude-haiku:  {provider: anthropic, model: claude-haiku-5-5,  input: "0.10", output: "0.50"}
  gpt:           {provider: openai,    model: gpt-5.4,           input: null,   output: null}
  gemini:        {provider: google,    model: gemini-2.5-pro,    input: null,   output: null}
  # Priced stand-ins so the full routing and budget path runs offline with fake providers.
  demo-large:    {provider: openai,    model: demo-large,        input: "3.00", output: "15.00"}
  demo-flash:    {provider: google,    model: demo-flash,        input: "0.30", output: "2.50"}

# Routes: what an app asks for -> primary model, then fallbacks in order.
routes:
  smart: [claude-opus, demo-large, claude-sonnet]
  fast:  [claude-haiku, demo-flash]
  cheap: [demo-flash, claude-haiku]

# Teams: which routes or models each may use, and a monthly budget in USD.
teams:
  support:
    allow: [fast, cheap]
    monthly_budget: "50.00"
    redact_prompts: true      # also strip PII before the prompt reaches the provider
  analytics:
    allow: [smart, fast, cheap, claude-sonnet]
    monthly_budget: "400.00"
    redact_prompts: false
  sandbox:
    allow: [cheap]
    monthly_budget: "0.05"
    redact_prompts: true
